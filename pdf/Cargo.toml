# PDFs as a plugin, built for WebAssembly: ghostwrite-dev/plugin-build's build.sh.
[package]
name = "ghostwrite-pdf-plugin"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ghostwrite-plugin-api = { git = "https://github.com/ghostwrite-dev/ghostwrite", tag = "plugin-api-v1.0.0" }
wit-bindgen = "0.57"
hayro = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[workspace]
